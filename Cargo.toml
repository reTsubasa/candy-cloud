[workspace]
resolver = "2"
members = [
    "crates/cloud-control",
    "crates/cloud-core-module",
    "crates/cloud-db",
    "crates/cloud-api",
    "crates/cloud-identity",
    "crates/cloud-auth",
    "crates/cloud-worker",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR MIT"
rust-version = "1.88"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
argon2 = "0.5"
axum = "0.8"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde", "clock"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
http-body-util = "0.1"
jsonwebtoken = "9"
libc = "0.2"
libloading = "0.8"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rcgen = { version = "0.14.8", features = ["x509-parser"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "mysql", "uuid", "chrono", "migrate", "macros"] }
thiserror = "2"
time = "0.3.54"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time"] }
toml = "0.8"
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
uuid = { version = "1", features = ["serde", "v4", "v7"] }
x509-parser = { version = "0.18", features = ["verify"] }

[workspace.metadata.candy]
core_version = "0.3.10"
core_revision = "a2ace9cb524dc5fcc2e01481ba9d515588a61936"
wire_line = "0.3"
auth_profile = "cloud_grant_v1"
