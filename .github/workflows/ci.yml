name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: candy-cloud
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: candy_cloud_test
          MYSQL_ROOT_PASSWORD: test-root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -ptest-root-password --silent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: mysql://root:test-root-password@127.0.0.1:3306/candy_cloud_test
    steps:
      - uses: actions/checkout@v4
        with:
          path: candy-cloud
      - name: Check out pinned Candy Core
        uses: actions/checkout@v4
        with:
          repository: reTsubasa/candy-core
          ref: 4bdd30d97852d1773bb5c60d7907bfb423e3ce1b
          path: candy-core
          token: ${{ secrets.CANDY_CORE_READ_TOKEN || github.token }}
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: candy-cloud -> target
      - run: cargo run -p cloud-db --bin cloud-db-migrate
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: tests/compose_smoke.sh
      - run: docker compose --env-file .env.example config >/dev/null
