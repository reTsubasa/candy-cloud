name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: cloud-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: candy-cloud
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: candy_cloud_test
          MYSQL_ROOT_PASSWORD: test-root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -ptest-root-password --silent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: mysql://root:test-root-password@127.0.0.1:3306/candy_cloud_test
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: candy-cloud
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: candy-cloud -> target
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: candy-cloud/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: candy-cloud/web
      - run: pnpm run typecheck && pnpm run lint && pnpm run test && pnpm run build
        working-directory: candy-cloud/web
      - run: cargo run -p cloud-db --bin cloud-db-migrate
      - run: python3 tests/api_contract.py
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Reject private Core source dependencies
        run: |
          private_token='CANDY_CORE''_READ_TOKEN'
          core_context='additional_contexts:.*candy-''core'
          core_path='(\.\./)+candy-''core'
          core_source_env='CANDY_CORE_''(DIR|SRC)'
          if rg -n -e "$private_token" -e "$core_context" -e "$core_path" -e "$core_source_env" \
            .github docker docker-compose.yml crates tests openwrt-sdwan Cargo.toml Cargo.lock; then
            echo 'Cloud still depends on private Core source' >&2
            exit 1
          fi
      - run: docker/install-core-cloud-module-test.sh
      - run: tests/compose_smoke.sh
      - run: docker compose --env-file .env.example config >/dev/null
