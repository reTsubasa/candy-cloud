name: release-x86-images

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - Cargo.lock
      - Cargo.toml
      - crates/**
      - web/**
      - docker/**
      - .github/workflows/release-x86-images.yml

permissions:
  contents: write

concurrency:
  group: cloud-x86-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    env:
      CORE_MODULE_VERSION: 0.3.34
      CORE_MODULE_TARGET: x86_64-unknown-linux-gnu
      CORE_MODULE_INPUT_TAG: core-v0.3.34
      RUNTIME_RELEASE_TAG: runtime-v0.4.0-r97
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: docker/setup-buildx-action@v3
      - name: Install verification tools
        run: |
          set -eu
          for command in cmake gcc git jq; do
            command -v "$command" >/dev/null || { echo "missing Runner tool: $command" >&2; exit 1; }
          done
          git init -q /tmp/usign
          git -C /tmp/usign remote add origin https://github.com/openwrt/usign.git
          git -C /tmp/usign fetch --depth 1 origin c4c72b1b07945ee192361dc751291a7c98d6adcd
          git -C /tmp/usign checkout -q FETCH_HEAD
          cmake -S /tmp/usign -B /tmp/usign/build -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/usign/build --parallel 2
          sudo install -m 0755 /tmp/usign/build/usign /usr/local/bin/usign
      - name: Download and verify signed Core module input
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          mkdir -m 0700 core-input
          base="candy-core-$CORE_MODULE_VERSION-cloud-abi-$CORE_MODULE_TARGET"
          gh release download "$CORE_MODULE_INPUT_TAG" --repo reTsubasa/candy-release --dir core-input \
            --pattern "$base.tar.gz" \
            --pattern "$base.tar.gz.sha256" \
            --pattern "$base.manifest.json"
          bundle="core-input/$base.tar.gz"
          manifest="core-input/$base.manifest.json"
          checksum="core-input/$base.tar.gz.sha256"
          test "$(find core-input -maxdepth 1 -type f | wc -l | tr -d ' ')" = 3
          (cd core-input && sha256sum -c "$(basename "$checksum")")
          work=$(mktemp -d)
          tar -xzf "$bundle" -C "$work"
          test "$(tar -tzf "$bundle" | sort)" = "$(printf '%s\n' libcandy_core_cloud.so manifest.json manifest.sig | sort)"
          test "$(usign -F -p keys/core-release.pub)" = d78de22abfca5b57
          usign -V -q -p keys/core-release.pub -m "$work/manifest.json" -x "$work/manifest.sig"
          cmp "$manifest" "$work/manifest.json"
          jq -e --arg target "$CORE_MODULE_TARGET" --arg version "$CORE_MODULE_VERSION" \
            '.schema_version == 1 and .release_kind == "candy-core" and .module.version == $version and .artifact.target == $target and .artifact.target_arch == "x86_64" and .artifact.libc == "glibc"' \
            "$manifest" >/dev/null
          {
            echo "CORE_MODULE_BUNDLE_SHA256=$(sha256sum "$bundle" | awk '{print $1}')"
            echo "CORE_MODULE_SHA256=$(jq -r .artifact.sha256 "$manifest")"
            echo "CORE_MODULE_URL=https://github.com/reTsubasa/candy-release/releases/download/$CORE_MODULE_INPUT_TAG/$base.tar.gz"
          } >> "$GITHUB_ENV"
      - name: Bind node installer to the finalized Runtime release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf web/public/install/manifests
          mkdir -p web/public/install/manifests
          gh release download "$RUNTIME_RELEASE_TAG" --repo reTsubasa/candy-release \
            --pattern 'linux-*.json' --dir web/public/install/manifests
          test "$(find web/public/install/manifests -maxdepth 1 -type f -name 'linux-*.json' | wc -l | tr -d ' ')" = 2
          for architecture in x86_64 aarch64; do
            manifest="web/public/install/manifests/linux-$architecture.json"
            jq -e --arg architecture "$architecture" --arg tag "$RUNTIME_RELEASE_TAG" '
              .schema_version == 1 and .platform == "linux" and .architecture == $architecture and
              (.runtime_url | contains("/reTsubasa/candy-release/releases/download/" + $tag + "/")) and
              (.runtime_sha256 | test("^[0-9a-f]{64}$")) and
              (.runtime_size | type == "number" and . > 0)
            ' "$manifest" >/dev/null
          done
      - name: Build native x86-64 service images
        run: |
          set -eu
          revision=${GITHUB_SHA::12}
          for spec in \
            migrate:cloud-db:cloud-db-migrate:runtime \
            cloud-api:cloud-api:cloud-api:runtime \
            cloud-identity:cloud-identity:cloud-identity:runtime; do
            IFS=: read -r image package binary target <<< "$spec"
            docker build --platform linux/amd64 --target "$target" \
              --build-arg PACKAGE="$package" --build-arg BINARY="$binary" \
              --build-arg RUST_TARGET=x86_64-unknown-linux-gnu \
              -t "candy-cloud-$image:x86-$revision" -f docker/rust-service.Dockerfile .
          done
          for spec in cloud-auth:cloud-auth:cloud-auth cloud-worker:cloud-worker:cloud-worker; do
            IFS=: read -r image package binary <<< "$spec"
            docker build --platform linux/amd64 --target runtime-core \
              --build-arg PACKAGE="$package" --build-arg BINARY="$binary" \
              --build-arg RUST_TARGET=x86_64-unknown-linux-gnu \
              --build-arg CORE_MODULE_VERSION="$CORE_MODULE_VERSION" \
              --build-arg CORE_MODULE_TARGET="$CORE_MODULE_TARGET" \
              --build-arg CORE_MODULE_URL="$CORE_MODULE_URL" \
              --build-arg CORE_MODULE_BUNDLE_SHA256="$CORE_MODULE_BUNDLE_SHA256" \
              --build-arg CORE_MODULE_SHA256="$CORE_MODULE_SHA256" \
              -t "candy-cloud-$image:x86-$revision" -f docker/rust-service.Dockerfile .
          done
          docker build --platform linux/amd64 -t "candy-cloud-cloud-web:x86-$revision" \
            -f docker/web.Dockerfile .
      - name: Verify and package images
        run: |
          set -eu
          revision=${GITHUB_SHA::12}
          images=(migrate cloud-api cloud-identity cloud-auth cloud-worker cloud-web)
          image_refs=()
          for image in "${images[@]}"; do
            test "$(docker image inspect "candy-cloud-$image:x86-$revision" --format '{{.Architecture}}')" = amd64
            image_refs+=("candy-cloud-$image:x86-$revision")
          done
          set +e
          docker run --rm "candy-cloud-cloud-api:x86-$revision" --help >/dev/null 2>&1
          help_status=$?
          set -e
          test "$help_status" -ne 132
          test "$help_status" -ne 139
          archive="candy-cloud-x86-$revision.tar.gz"
          docker save "${image_refs[@]}" | gzip -1 > "$archive"
          sha256sum "$archive" > "$archive.sha256"
          jq -n --arg commit "$GITHUB_SHA" --arg revision "$revision" \
            --arg core_version "$CORE_MODULE_VERSION" --arg core_target "$CORE_MODULE_TARGET" \
            --arg core_bundle_sha "$CORE_MODULE_BUNDLE_SHA256" --arg core_module_sha "$CORE_MODULE_SHA256" \
            --arg runtime_release_tag "$RUNTIME_RELEASE_TAG" \
            '{schema_version:1,source:{repository:"reTsubasa/candy-cloud",commit:$commit},architecture:"x86_64",core:{version:$core_version,target:$core_target,bundle_sha256:$core_bundle_sha,module_sha256:$core_module_sha},runtime:{release_tag:$runtime_release_tag},images:["migrate","cloud-api","cloud-identity","cloud-auth","cloud-worker","cloud-web"]}' \
            > "candy-cloud-x86-$revision.json"
      - name: Publish immutable prerelease assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          revision=${GITHUB_SHA::12}
          tag="cloud-x86-$revision"
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --target "$GITHUB_SHA" --prerelease \
            --title "Candy Cloud x86-64 $revision" --notes "Native x86-64 deployment images built from $GITHUB_SHA."
          gh release upload "$tag" \
            "candy-cloud-x86-$revision.tar.gz" \
            "candy-cloud-x86-$revision.tar.gz.sha256" \
            "candy-cloud-x86-$revision.json" --clobber
